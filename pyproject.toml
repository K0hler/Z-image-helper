[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "z-prompt-helper"
version = "0.1.0"
description = "Local prompt workbench for Z-Image Turbo"
requires-python = ">=3.12"
dependencies = [
  "streamlit>=1.44,<2.0",
  "streamlit-shadcn-ui>=0.1.19,<0.2",
  "httpx>=0.27,<1.0",
  "pydantic>=2.7,<3.0",
  "keyring>=25.2,<26.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "pytest-cov>=5.0,<6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zprompt_helper"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
